[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cerebro-docs"
version = "0.1.0"
description = "Cerebro ecosystem documentation MCP — progressive reveal for agents"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
cerebro-docs = "cerebro_docs.cli:main"
