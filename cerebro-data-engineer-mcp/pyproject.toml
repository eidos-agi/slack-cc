[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cerebro-data-engineer"
version = "0.1.0"
description = "AI data engineer MCP — knows the company's data topology, runs QA, diagnoses pipeline issues"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "psycopg2-binary>=2.9.0",
]

[project.scripts]
cerebro-data-engineer = "cerebro_data_engineer.cli:main"
