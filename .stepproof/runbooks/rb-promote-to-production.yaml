# Promote staging to production — Rhea gate required.
# Source: cerebro-docs workflow('promote_to_production')
# This is the highest-ceremony operation in the system.

template_id: rb-promote-to-production
version: 1.0.0
name: Promote to production
description: PR develop→main, CI green, Rhea challenge gate, merge, verify production deploy, smoke test.
risk_level: high
allowed_environments: [production]

steps:
  - step_id: s1
    description: Open PR develop→main
    allowed_tools: [mcp__cerebro-github__open_pr]
    required_evidence: [branch_name, pr_url]
    verification_method: verify_pr_opened
    verification_tier: tier1
    timeout_seconds: 3600
    on_fail: retry

  - step_id: s2
    description: CI tests green
    allowed_tools: [mcp__cerebro-github__check_ci]
    required_evidence: [ci_run_id]
    verification_method: verify_ci_green
    verification_tier: tier1
    timeout_seconds: 1800
    on_fail: block

  - step_id: s3
    description: PR approved
    allowed_tools: [mcp__cerebro-github__merge_pr]
    required_evidence: [pr_url, approval_count]
    verification_method: verify_pr_approved
    verification_tier: tier1
    timeout_seconds: 86400
    on_fail: block

  - step_id: s4
    description: Merge to main (Rhea gate fires)
    allowed_tools: [mcp__cerebro-github__merge_pr, mcp__rhea__rhea_quick]
    required_evidence: [pr_url, ci_run_id]
    verification_method: verify_ci_green
    verification_tier: tier1
    timeout_seconds: 600
    on_fail: block

  - step_id: s5
    description: Production Railway deploy succeeds
    allowed_tools: [mcp__railguey__railguey_service_info, mcp__railguey__railguey_account_default]
    required_evidence: [deploy_id]
    verification_method: verify_deploy_and_health
    verification_tier: tier1
    timeout_seconds: 600
    on_fail: block

  - step_id: s6
    description: Smoke test production
    allowed_tools: [mcp__cerebro-web-builder__smoke_test, mcp__cerebro-verifier__smoke_test]
    required_evidence: [smoke_run_id]
    verification_method: verify_smoke_logs
    verification_tier: tier1
    timeout_seconds: 600
    on_fail: block
