# Ship a feature branch to staging.
# Source: cerebro-docs workflow('ship_to_staging')

template_id: rb-ship-to-staging
version: 1.0.0
name: Ship to staging
description: Create issue, open PR, CI green, merge to develop, verify Railway deploy, smoke test.
risk_level: medium
allowed_environments: [staging]

steps:
  - step_id: s1
    description: Create tracking issue
    allowed_tools: [mcp__cerebro-github__create_work]
    required_evidence: [issue_number]
    verification_method: verify_git_commit
    verification_tier: tier1
    timeout_seconds: 600
    on_fail: retry

  - step_id: s2
    description: Open PR against develop with Closes #N
    allowed_tools: [Edit, Write, Bash, mcp__cerebro-github__open_pr]
    required_evidence: [branch_name, pr_url]
    verification_method: verify_pr_opened
    verification_tier: tier1
    timeout_seconds: 3600
    on_fail: retry

  - step_id: s3
    description: CI tests green on PR
    allowed_tools: [mcp__cerebro-github__check_ci]
    required_evidence: [ci_run_id]
    verification_method: verify_ci_green
    verification_tier: tier1
    timeout_seconds: 1800
    on_fail: block

  - step_id: s4
    description: Merge PR to develop
    allowed_tools: [mcp__cerebro-github__merge_pr]
    required_evidence: [pr_url, ci_run_id]
    verification_method: verify_ci_green
    verification_tier: tier1
    timeout_seconds: 600
    on_fail: block

  - step_id: s5
    description: Railway staging deploy succeeds
    allowed_tools: [mcp__railguey__railguey_service_info, mcp__railguey__railguey_account_default]
    required_evidence: [deploy_id]
    verification_method: verify_deploy_and_health
    verification_tier: tier1
    timeout_seconds: 600
    on_fail: block

  - step_id: s6
    description: Smoke test staging pages
    allowed_tools: [mcp__cerebro-web-builder__smoke_test]
    required_evidence: [smoke_run_id]
    verification_method: verify_smoke_logs
    verification_tier: tier1
    timeout_seconds: 600
    on_fail: block
