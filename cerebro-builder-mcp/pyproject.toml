[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cerebro-builder"
version = "0.1.0"
description = "Orchestrator MCP — mission, topology, and child process ceremony for Cerebro"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
cerebro-builder = "cerebro_builder.cli:main"
