name: CI health audit

# Safety net for silent CI breakage. Scans every Greenmark repo's recent
# workflow runs and flags persistent failures (3+ consecutive). Also
# catches stale dependabot PRs. Runs daily; opens an issue on this repo
# (greenmark-cockpit) when problems are found.
#
# Complements the pull-based ci_health MCP tool in cerebro-mcp — this is
# the push side that catches issues without anyone asking.

on:
  schedule:
    - cron: "30 7 * * *"   # 7:30 UTC daily (2:30 AM CT)
  workflow_dispatch:

jobs:
  ci-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Scan workflow health across org
        id: scan
        env:
          GH_TOKEN: ${{ secrets.GOV_AUDIT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ORG="greenmark-waste-solutions"
          FAIL_THRESHOLD=3
          STALE_DAYS=7
          ISSUES=""
          REPOS_CHECKED=0
          FAILING=0

          echo "Scanning $ORG repos for CI health..."

          # Get non-archived repos, sorted by recent push
          REPOS=$(gh repo list "$ORG" --no-archived --limit 30 --json name --jq '.[].name')

          for repo in $REPOS; do
            REPOS_CHECKED=$((REPOS_CHECKED + 1))
            REPO_HAS_ISSUE=false

            # Get recent completed workflow runs
            RUNS=$(gh run list -R "$ORG/$repo" --limit 30 --status completed --json name,conclusion,createdAt 2>/dev/null || echo "[]")
            if [ "$RUNS" = "[]" ] || [ -z "$RUNS" ]; then
              continue
            fi

            # Group by workflow name, check for consecutive failures
            WORKFLOW_NAMES=$(echo "$RUNS" | jq -r '.[].name' | sort -u)
            while IFS= read -r wf_name; do
              [ -z "$wf_name" ] && continue
              # Get the last N runs for this workflow (newest first from API)
              CONSECUTIVE_FAILS=$(echo "$RUNS" | jq -r --arg name "$wf_name" '
                [.[] | select(.name == $name)] | .[0:5] |
                [.[] | .conclusion] |
                if length == 0 then 0
                else
                  # Count consecutive "failure" from the start
                  reduce .[] as $c (0; if $c == "failure" and . >= 0 then . + 1 else -1 end) |
                  if . < 0 then 0 else . end
                end
              ')

              if [ "$CONSECUTIVE_FAILS" -ge "$FAIL_THRESHOLD" ]; then
                REPO_HAS_ISSUE=true
                LATEST_DATE=$(echo "$RUNS" | jq -r --arg name "$wf_name" '[.[] | select(.name == $name)][0].createdAt // "unknown"' | cut -c1-10)
                SEVERITY="⚠️"
                [ "$CONSECUTIVE_FAILS" -ge 5 ] && SEVERITY="🔴"
                ISSUES="$ISSUES\n$SEVERITY **$repo** — \`$wf_name\`: $CONSECUTIVE_FAILS consecutive failures (latest: $LATEST_DATE)"
              fi
            done <<< "$WORKFLOW_NAMES"

            # Check for stale dependabot PRs
            STALE_CUTOFF=$(date -u -d "$STALE_DAYS days ago" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-${STALE_DAYS}d +%Y-%m-%dT%H:%M:%SZ)
            STALE_PRS=$(gh pr list -R "$ORG/$repo" --state open --json title,createdAt,author --jq "[.[] | select(.author.login == \"dependabot[bot]\" and .createdAt < \"$STALE_CUTOFF\")] | length" 2>/dev/null || echo "0")
            if [ "$STALE_PRS" -gt 0 ]; then
              ISSUES="$ISSUES\nℹ️ **$repo** — $STALE_PRS stale dependabot PR(s) (>$STALE_DAYS days old)"
            fi

            if [ "$REPO_HAS_ISSUE" = true ]; then
              FAILING=$((FAILING + 1))
            fi
          done

          echo "repos_checked=$REPOS_CHECKED" >> $GITHUB_OUTPUT
          echo "failing=$FAILING" >> $GITHUB_OUTPUT

          if [ -n "$ISSUES" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
            echo "issues<<$EOF" >> $GITHUB_OUTPUT
            echo -e "$ISSUES" >> $GITHUB_OUTPUT
            echo "$EOF" >> $GITHUB_OUTPUT
            echo -e "\nIssues found:\n$ISSUES"
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "All $REPOS_CHECKED repos healthy."
          fi

      - name: Open or update issue if problems found
        if: steps.scan.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCAN_ISSUES: ${{ steps.scan.outputs.issues }}
          REPOS_CHECKED: ${{ steps.scan.outputs.repos_checked }}
          FAILING_COUNT: ${{ steps.scan.outputs.failing }}
        run: |
          TITLE="CI health: ${FAILING_COUNT} repo(s) with failing workflows"

          # Write body to file — avoids shell interpreting backticks in
          # workflow names like `settings.yml audit` as command substitution.
          {
            echo "## CI Health Audit"
            echo ""
            echo "**Date:** $(date -u +%Y-%m-%d)"
            echo "**Repos scanned:** ${REPOS_CHECKED}"
            echo "**Repos with issues:** ${FAILING_COUNT}"
            echo ""
            echo "### Issues"
            echo ""
            echo -e "${SCAN_ISSUES}"
            echo ""
            echo "---"
            echo ""
            echo "Auto-generated by ci-health-audit.yml. Also queryable via ci_health admin tool in cerebro-mcp."
          } > /tmp/ci-health-body.md

          EXISTING=$(gh issue list --label "ci-health" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file /tmp/ci-health-body.md
            echo "Updated existing issue #$EXISTING"
          else
            gh label create "ci-health" --color "d93f0b" --description "Auto-filed CI health issues" 2>/dev/null || true
            gh issue create --title "$TITLE" --body-file /tmp/ci-health-body.md --label "ci-health"
            echo "Created new CI health issue"
          fi

      - name: Close issue if all healthy
        if: steps.scan.outputs.found == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list --label "ci-health" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "All ${{ steps.scan.outputs.repos_checked }} repos healthy as of $(date -u +%Y-%m-%d). Auto-closing."
            echo "Closed issue #$EXISTING — all healthy"
          fi
